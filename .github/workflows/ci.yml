name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      - run: npm run dist:windows
      - uses: actions/upload-artifact@v7
        with:
          name: LocalBoard-windows-${{ github.sha }}
          path: |
            dist/LocalBoard-Setup-*.exe
            dist/LocalBoard-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 14
